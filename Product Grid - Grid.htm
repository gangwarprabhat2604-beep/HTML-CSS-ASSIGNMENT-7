<!DOCTYPE html>
<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>Product Grid - Grid</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
  body{padding:20px;background:#fff8f0}
  h1{text-align:center;color:#5b2a1a;margin-bottom:20px}
  .products{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:20px;
  }
  .card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px #ddd;
    text-align:center;
  }
  .card .emoji{font-size:40px}
  .card h3{margin:10px 0;color:#5b2a1a}
  .price{font-weight:bold;color:#e67e22;margin:8px 0}
  button{background:#5b2a1a;color:white;border:none;padding:8px 18px;border-radius:20px;cursor:pointer}
</style>
</head>
<body>
  <h1>Our Products</h1>
  <div class="products">
    <div class="card"><div class="emoji">🎂</div><h3>Chocolate Cake</h3><div class="price">₹499</div><button>Buy Now</button></div>
    <div class="card"><div class="emoji">🧁</div><h3>Cupcakes</h3><div class="price">₹299</div><button>Buy Now</button></div>
    <div class="card"><div class="emoji">🍓</div><h3>Strawberry Cake</h3><div class="price">₹549</div><button>Buy Now</button></div>
    <div class="card"><div class="emoji">🍩</div><h3>Donuts</h3><div class="price">₹199</div><button>Buy Now</button></div>
    <div class="card"><div class="emoji">🍪</div><h3>Cookies</h3><div class="price">₹149</div><button>Buy Now</button></div>
    <div class="card"><div class="emoji">🥐</div><h3>Croissant</h3><div class="price">₹99</div><button>Buy Now</button></div>
    <div class="card"><div class="emoji">🍞</div><h3>Bread</h3><div class="price">₹79</div><button>Buy Now</button></div>
    <div class="card"><div class="emoji">🎁</div><h3>Gift Hamper</h3><div class="price">₹999</div><button>Buy Now</button></div>
  </div>
